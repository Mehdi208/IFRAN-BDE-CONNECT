<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" error
      if (typeof window !== 'undefined' && window.fetch) {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function() { /* ignore attempts to overwrite fetch */ },
            configurable: true
          });
        } catch (e) {
          console.warn('Could not redefine window.fetch', e);
        }
      }

      // Initialisation instantanée du Mode Sombre Admin sans flash blanc
      try {
        const savedDarkMode = localStorage.getItem('adminDarkMode');
        if (savedDarkMode === 'true' || savedDarkMode === null) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>

    <!-- SEO Principal -->
    <title>BDE Connect IFRAN - La Plateforme Officielle</title>
    <meta name="description" content="Plateforme officielle du Bureau des Étudiants de l'IFRAN Côte d'Ivoire. Gestion des événements, clubs, tutorats et vie étudiante." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bde-ifran-app.web.app/" />
    <meta property="og:title" content="BDE Connect IFRAN" />
    <meta property="og:description" content="Rejoignez la vie étudiante ! Découvrez les clubs, l'agenda des événements et l'équipe du BDE IFRAN." />
    <meta property="og:image" content="https://bde-ifran-app.web.app/logo.png?v=4" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://bde-ifran-app.web.app/" />
    <meta property="twitter:title" content="BDE Connect IFRAN" />
    <meta property="twitter:description" content="Rejoignez la vie étudiante ! Découvrez les clubs, l'agenda des événements et l'équipe du BDE IFRAN." />
    <meta property="twitter:image" content="https://bde-ifran-app.web.app/logo.png?v=4" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bde: {
                navy: '#0F1E3A', // Bleu Marine
                rose: '#E74A67', // Rouge Rosé
                white: '#FFFFFF',
                light: '#F8FAFC',
                text: '#1E293B',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-in-up': 'fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fadeIn 1.2s ease-out forwards',
              'float': 'float 12s ease-in-out infinite',
              'float-delayed': 'float 12s ease-in-out 4s infinite',
              'float-slow': 'float 16s ease-in-out 2s infinite',
              'gradient-x': 'gradient-x 15s ease infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(30px)' }, /* CHANGED from 60px to 30px for subtlety */
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-12px)' },
              },
              'gradient-x': {
                '0%, 100%': {
                    'background-size': '200% 200%',
                    'background-position': 'left center'
                },
                '50%': {
                    'background-size': '200% 200%',
                    'background-position': 'right center'
                },
              },
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ========================================================
         LIGNES DE FLUIDITÉ DU SCROLL (STANDARD WORDPRESS / LENIS)
         ======================================================== */
      html {
        scroll-behavior: smooth !important;
        scroll-padding-top: 80px;
        -webkit-overflow-scrolling: touch;
      }

      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #F8FAFC;
        overflow-x: hidden;
        text-rendering: optimizeLegibility;
      }

      /* Momentum inertia and fluid GPU composite rendering */
      @media (prefers-reduced-motion: no-preference) {
        :root {
          scroll-behavior: smooth;
        }
      }

      /* Barres de défilement fluides personnalisées */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      /* Système d'animation au scroll (Reveal) */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity;
      }
      
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      /* Animation texte brillant */
      .shiny-effect {
        background: linear-gradient(to right, #9ca3af 0%, #ffffff 50%, #9ca3af 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: shine 3s linear infinite;
        font-weight: 800;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
      }
      
      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      /* Utilitaires pour masquer la scrollbar tout en gardant le scroll */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
          scrollbar-width: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* ========================================================
         MODE SOMBRE ADMINISTRATEUR RETAPÉ & ULTRA-LISIBLE
         ======================================================== */
      html.dark {
        color-scheme: dark;
      }

      html.dark, html.dark body {
        background-color: #0b1120 !important;
        color: #f1f5f9 !important;
      }

      /* Cartes & Surfaces de premier niveau */
      html.dark .bg-white {
        background-color: #131b2e !important;
        border-color: #1e293b !important;
        color: #f8fafc;
      }

      html.dark .bg-gray-50, 
      html.dark .bg-slate-50 {
        background-color: #0d1527 !important;
      }

      html.dark .bg-gray-100, 
      html.dark .bg-slate-100 {
        background-color: #111a2e !important;
        border-color: #1e293b !important;
      }

      /* Couleurs de textes nettes et contrastées */
      html.dark .text-gray-900, 
      html.dark .text-gray-800, 
      html.dark .text-bde-navy {
        color: #f8fafc !important;
      }

      html.dark .text-gray-700,
      html.dark .text-slate-700 {
        color: #e2e8f0 !important;
      }

      html.dark .text-gray-600,
      html.dark .text-slate-600 {
        color: #cbd5e1 !important;
      }

      html.dark .text-gray-500,
      html.dark .text-slate-500 {
        color: #94a3b8 !important;
      }

      html.dark .text-gray-400,
      html.dark .text-slate-400 {
        color: #94a3b8 !important;
      }

      /* Bordures de séparation élégantes */
      html.dark .border-gray-100, 
      html.dark .border-gray-200, 
      html.dark .border-gray-300,
      html.dark .border-slate-200 {
        border-color: #1e293b !important;
      }

      html.dark .divide-gray-200 > :not([hidden]) ~ :not([hidden]),
      html.dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]),
      html.dark .divide-slate-200 > :not([hidden]) ~ :not([hidden]) {
        border-color: #1e293b !important;
      }

      /* Champs de formulaires en mode sombre */
      html.dark input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]), 
      html.dark select, 
      html.dark textarea {
        background-color: #0d1527 !important;
        color: #f8fafc !important;
        border-color: #334155 !important;
      }

      html.dark input:focus, 
      html.dark select:focus, 
      html.dark textarea:focus {
        border-color: #e74a67 !important;
        box-shadow: 0 0 0 2px rgba(231, 74, 103, 0.25) !important;
      }

      html.dark input::placeholder, 
      html.dark textarea::placeholder {
        color: #64748b !important;
      }

      /* Tableaux administratifs */
      html.dark table th {
        background-color: #090e1a !important;
        color: #cbd5e1 !important;
        border-color: #1e293b !important;
      }

      html.dark table td {
        border-color: #1e293b !important;
      }

      html.dark table tbody tr:hover {
        background-color: rgba(30, 41, 59, 0.6) !important;
      }

      /* Ombres portées sombres profondes */
      html.dark .shadow-sm {
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.5), 0 1px 2px -1px rgba(0, 0, 0, 0.5) !important;
      }

      html.dark .shadow-md,
      html.dark .shadow-lg,
      html.dark .shadow-xl {
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.6) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
